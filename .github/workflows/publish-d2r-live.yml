name: Publish D2R ICON-EU LIVE

on:
  workflow_dispatch:
  schedule:
    # Scheduled workflows can be delayed; hourly at an off-peak minute is needed
    # to keep a 90-minute LIVE freshness budget realistic.
    - cron: "17 * * * *"

permissions:
  contents: write

jobs:
  publish:
    concurrency:
      group: d2r-live-publish
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install producer dependency
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-live.txt
      - name: Generate complete candidate into isolated staging
        id: generate
        continue-on-error: true
        env:
          D2R_OUTPUT_DIR: ${{ runner.temp }}/d2r-live
        run: python build_live_iberia.py
      - name: Read remote state immediately before decision
        run: |
          git fetch origin main
          git show origin/main:live/manifest.json > "${{ runner.temp }}/remote-manifest.json" || true
      - name: Decide explicitly against remote state
        id: decision
        run: python publication_decision.py --candidate "${{ runner.temp }}/d2r-live/manifest.json" --current "${{ runner.temp }}/remote-manifest.json" --github-output "$GITHUB_OUTPUT"
      - name: Validate candidate
        if: steps.decision.outputs.decision == 'PUBLISH'
        run: python validate_live.py "${{ runner.temp }}/d2r-live"
      - name: Publish atomically without downgrade
        if: steps.decision.outputs.decision == 'PUBLISH'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          git show origin/main:live/manifest.json > "${{ runner.temp }}/remote-before-push.json" || true
          python publication_decision.py --candidate "${{ runner.temp }}/d2r-live/manifest.json" --current "${{ runner.temp }}/remote-before-push.json"
          candidate="${{ runner.temp }}/d2r-live/manifest.json"
          stage="${{ runner.temp }}/public-live"
          mkdir -p "$stage"
          cp "$candidate" "$stage/manifest.json"
          cp "${{ runner.temp }}/d2r-live/iberia.pawind.gz" "$stage/iberia.pawind.gz"
          cp "${{ runner.temp }}/d2r-live/iberia.patemp.gz" "$stage/iberia.patemp.gz"
          python validate_live.py "$stage"
          mkdir -p live
          cp "$stage/manifest.json" live/manifest.json
          cp "$stage/iberia.pawind.gz" live/iberia.pawind.gz
          cp "$stage/iberia.patemp.gz" live/iberia.patemp.gz
          git add live/manifest.json live/iberia.pawind.gz live/iberia.patemp.gz
          if git diff --cached --quiet; then
            echo "FINAL=KEEP_CURRENT reason=byte_identical"
            exit 0
          fi
          echo "decision=PUBLISH reason=complete_wind_temperature_pair_changed"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update D2R ICON-EU LIVE"
          git push
      - name: Confirm final remote freshness
        run: |
          git fetch origin main
          git show origin/main:live/manifest.json > "${{ runner.temp }}/final-manifest.json"
          python publication_decision.py --current "${{ runner.temp }}/final-manifest.json"
